<!-- index.html -->

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>meow</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%230284c7'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              rounded: ["'M PLUS Rounded 1c'", "sans-serif"],
              pop: ["Fredoka", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>

  <body
    class="font-rounded text-[#334155] bg-[#f0f9ff] min-h-screen py-12 px-6 antialiased"
  >
    <main class="max-w-[680px] mx-auto">
      <!-- シンプルでポップなタイトルエリア -->
      <header class="mb-10 text-center">
        <h1
          class="font-pop text-4xl sm:text-5xl font-semibold text-[#0284c7] tracking-wide mb-2"
        >
          meow
        </h1>
        <p class="text-xs text-[#38bdf8] font-medium tracking-wider">
          数字であそぼう
        </p>
      </header>

      <!-- 記事一覧カード -->
      <div id="post-list" class="flex flex-col gap-4">
        <p class="text-[#94a3b8] text-sm text-center py-8">loading...</p>
      </div>
    </main>

    <script type="module">
      import { parseMyText } from "./js/parser.js";

      const script = document.createElement("script");
      script.src = "./posts/index.js";

      script.onload = async () => {
        const slugs = window.blogSlugs || [];
        const container = document.getElementById("post-list");

        if (slugs.length === 0) {
          container.innerHTML =
            '<p class="text-[#94a3b8] text-center">まだ記事がないよん</p>';
          return;
        }

        const loadPost = (slug) => {
          return new Promise((resolve) => {
            const s = document.createElement("script");
            s.src = `./posts/${slug}.js`;
            s.onload = () => {
              const raw = window.currentPost || {};
              const formattedDate = raw.date || slug.replace(/-/g, ".");
              const rawText = raw.problem || raw.content || "";
              const formattedContent = parseMyText(rawText);

              let imageSrc = null;
              if (raw.image) {
                imageSrc =
                  raw.image.startsWith("http") || raw.image.startsWith("./")
                    ? raw.image
                    : `./images/${raw.image}`;
              }

              resolve({
                slug: slug,
                title: raw.title || "無題",
                date: formattedDate,
                contentHtml: formattedContent,
                image: imageSrc,
                hasAnswer: !!raw.answer,
              });
            };
            document.head.appendChild(s);
          });
        };

        const posts = await Promise.all(slugs.map(loadPost));

        container.innerHTML = posts
          .map(
            (post) => `
<a href="./post.html?id=${post.slug}" class="group block p-6 bg-white border-[#f0f9ff] rounded-2xl transition-all duration-200 ease-out hover:-translate-y-1 hover:shadow-[6px_6px_0px_#bae6fd] hover:border-[#7dd3fc]">  <span class="text-xs text-[#0284c7] tracking-wider block mb-1 font-semibold">${post.date}</span>
  <h2 class="text-base font-bold text-[#1e293b] mb-2">${post.title}</h2>
  
  <!-- 問題文エリア -->
  <div class="text-sm text-[#64748b] leading-relaxed mb-3 space-y-2">
    ${post.contentHtml}
  </div>

${
  post.image
    ? `
        <div class="my-6 text-center">
          <div class="relative inline-block mx-auto">
            <div class="absolute -top-3 -left-3 w-16 h-6 bg-[#38bdf8]/70 rotate-[-15deg] rounded-sm z-10"></div>
            <div class="absolute -bottom-3 -right-3 w-16 h-6 bg-[#fb923c]/70 rotate-[-15deg] rounded-sm z-10"></div>

            <div class="bg-white p-1.5 border border-[#e2e8f0] rounded-sm shadow-[4px_4px_0px_#bae6fd]">
               <img src="${post.image}" alt="${post.title}" class="max-h-[220px] w-auto object-contain" loading="lazy">
            </div>
          </div>
        </div>
      `
    : ""
}

<!-- ボタン（普段は薄く、カードをホバーすると濃くなるにゃ） -->
<span class="inline-flex items-center text-xs font-bold text-white bg-[#0284c7]/40 px-3.5 py-2 rounded-full transition-all duration-200 group-hover:bg-[#0284c7]/80">
    ${post.hasAnswer ? "答え・解説はこちら →" : "続きを読む →"}
  </span>
</a>
`,
          )
          .join("");
      };

      document.head.appendChild(script);
    </script>
  </body>
</html>
