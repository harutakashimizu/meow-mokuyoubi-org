<!-- index.html -->

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>meow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/tailwind.config.js"></script>
  </head>

  <body
    class="font-rounded text-brand-text bg-brand-bg min-h-screen py-12 px-6 antialiased"
  >
    <main class="max-w-[680px] mx-auto">
      <!-- 共通ヘッダー読み込みエリア -->
      <div id="header-container"></div>

      <!-- 記事一覧カード -->
      <div id="post-list" class="flex flex-col gap-6">
        <p class="text-brand-muted text-sm text-center py-8">loading...</p>
      </div>
    </main>

    <!-- ヘッダー挿入用スクリプト -->
    <script src="./js/header.js"></script>

    <script type="module">
      // 一覧プレビュー用のテキストお掃除関数
      const createPlainTextPreview = (text) => {
        if (!text) return "";
        return text
          .replace(/\[js:.*?\]/g, "")
          .replace(/!\[.*?\]\(.*?\)/g, "")
          .replace(/^#+\s+/gm, "")
          .replace(/\*\*(.*?)\*\*/g, "$1")
          .replace(/^\*\s+/gm, "")
          .replace(/<[^>]*>/g, "")
          .trim();
      };

      const script = document.createElement("script");
      script.src = "./posts/index.js";

      script.onload = async () => {
        const slugs = window.blogSlugs || [];
        const container = document.getElementById("post-list");

        if (slugs.length === 0) {
          container.innerHTML =
            '<p class="text-brand-muted text-center">まだ記事がないよん</p>';
          return;
        }

        const loadPost = (slug) => {
          return new Promise((resolve) => {
            const s = document.createElement("script");
            s.src = `./posts/${slug}.js`;
            s.onload = () => {
              const raw = window.currentPost || {};
              const formattedDate = raw.date || slug.replace(/-/g, ".");

              const isQuestion = !!raw.question;
              const rawText = isQuestion ? raw.question : raw.content || "";

              const previewText = createPlainTextPreview(rawText);

              let imageSrc = null;
              if (raw.image) {
                imageSrc =
                  raw.image.startsWith("http") || raw.image.startsWith("./")
                    ? raw.image
                    : `./images/${raw.image}`;
              }

              resolve({
                slug: slug,
                title: raw.title || "無題",
                date: formattedDate,
                previewText: previewText,
                image: imageSrc,
                hasAnswer: !!raw.answer,
                isQuestion: isQuestion,
              });
            };
            document.head.appendChild(s);
          });
        };

        const posts = await Promise.all(slugs.map(loadPost));

        container.innerHTML = posts
          .map(
            (post) => `
<a href="./post.html?id=${post.slug}" class="group block p-6 bg-brand-card border-brand-light rounded-2xl transition-all duration-200 ease-out hover:-translate-y-1 hover:shadow-pop-card hover:border-brand-sub">
  <span class="text-sm text-brand-primary tracking-wider block mb-1 font-semibold">${post.date}</span>
  <h2 class="text-xl font-bold text-brand-darkText mb-2">${post.title}</h2>
  
  <!-- 文章エリア（プレビュー用プレーンテキスト） -->
  <p class="text-base text-brand-bodyText leading-relaxed mb-3 line-clamp-3 whitespace-pre-wrap">${post.previewText}</p>

${
  post.image
    ? `
        <div class="my-6 text-center">
          <div class="relative inline-block mx-auto">
            <div class="absolute -top-3 -left-3 w-16 h-6 bg-brand-sub/70 rotate-[-15deg] rounded-sm z-10"></div>
            <div class="absolute -bottom-3 -right-3 w-16 h-6 bg-brand-accent/70 rotate-[-15deg] rounded-sm z-10"></div>

            <div class="bg-brand-card p-1.5 border border-slate-200 rounded-sm shadow-pop-photo">
               <img src="${post.image}" alt="${post.title}" class="max-h-[220px] w-auto object-contain" loading="lazy">
            </div>
          </div>
        </div>
      `
    : ""
}

<!-- ボタン -->
<span class="inline-flex items-center text-sm font-bold text-white bg-brand-primary/40 px-3.5 py-2 rounded-full transition-all duration-200 group-hover:bg-brand-primary/80">
    ${post.isQuestion ? (post.hasAnswer ? "答え・解説はこちら →" : "問題を見る →") : "続きを読む →"}
  </span>
</a>
`,
          )
          .join("");
      };

      document.head.appendChild(script);
    </script>
  </body>
</html>
