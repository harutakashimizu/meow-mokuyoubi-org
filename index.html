<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>meow🐾</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              rounded: ["'M PLUS Rounded 1c'", "sans-serif"],
              pop: ["Fredoka", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>

  <body
    class="font-rounded text-[#334155] bg-[#f0f9ff] min-h-screen py-12 px-6 antialiased"
  >
    <main class="max-w-[680px] mx-auto">
      <!-- シンプルでポップなタイトルエリア -->
      <header class="mb-10 text-center">
        <h1
          class="font-pop text-4xl sm:text-5xl font-semibold text-[#0284c7] tracking-wide mb-2"
        >
          my blog
        </h1>
        <p class="text-xs text-[#38bdf8] font-medium tracking-wider">
          日常のあれこれ
        </p>
      </header>

      <!-- 記事一覧カード -->
      <div id="post-list" class="flex flex-col gap-4">
        <p class="text-[#94a3b8] text-sm text-center py-8">loading...</p>
      </div>
    </main>

    <script type="module">
      const script = document.createElement("script");
      script.src = "./posts/index.js";

      script.onload = async () => {
        const slugs = window.blogSlugs || [];
        const container = document.getElementById("post-list");

        if (slugs.length === 0) {
          container.innerHTML =
            '<p class="text-[#94a3b8] text-center">まだ記事がないにゃん</p>';
          return;
        }

        const loadPost = (slug) => {
          return new Promise((resolve) => {
            const s = document.createElement("script");
            s.src = `./posts/${slug}.js`;
            s.onload = () => {
              const raw = window.currentPost || {};
              const formattedDate = slug.replace(/-/g, ".");
              const plainText = (raw.content || "").replace(/[*_#`\n]/g, "");
              const summary =
                plainText.length > 50
                  ? plainText.slice(0, 50) + "..."
                  : plainText;

              resolve({
                slug: slug,
                title: raw.title || "無題",
                date: formattedDate,
                summary: summary,
              });
            };
            document.head.appendChild(s);
          });
        };

        const posts = await Promise.all(slugs.map(loadPost));

        container.innerHTML = posts
          .map(
            (post) => `
<a href="./post.html?id=${post.slug}" class="block p-6 bg-white border-[#f0f9ff] rounded-2xl transition-all duration-200 ease-out hover:-translate-y-1 hover:shadow-[6px_6px_0px_#bae6fd] hover:border-[#7dd3fc]">
  <span class="text-xs text-[#0284c7] tracking-wider block mb-1 font-semibold">${post.date}</span>
  <h2 class="text-base font-bold text-[#1e293b] mb-1.5">${post.title}</h2>
  <p class="text-sm text-[#64748b] leading-relaxed">${post.summary}</p>
</a>
`,
          )
          .join("");
      };

      document.head.appendChild(script);
    </script>
  </body>
</html>
