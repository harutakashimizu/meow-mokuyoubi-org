<!-- post.html -->

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              rounded: ["'M PLUS Rounded 1c'", "sans-serif"],
              pop: ["Fredoka", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="font-rounded text-[#334155] bg-[#f0f9ff] min-h-screen py-10 px-4 antialiased"
  >
    <main class="max-w-[680px] mx-auto">
      <article
        class="bg-white/90 backdrop-blur-sm border border-[#e0f2fe] rounded-3xl p-6 sm:p-10 shadow-sm"
      >
        <p
          id="post-date"
          class="text-xs text-[#0284c7] font-semibold tracking-wider mb-2"
        ></p>
        <h1
          id="post-title"
          class="text-2xl sm:text-3xl font-bold text-[#0f172a] mb-6"
        >
          loading...
        </h1>

        <div class="h-0.5 bg-[#f0f9ff] w-full mb-8 rounded-full"></div>

        <!-- 本文エリア -->
        <div
          id="post-body"
          class="text-[#475569] leading-relaxed space-y-4 text-sm sm:text-base"
        ></div>

        <!-- ナビゲーションエリア（前の問題 / 次の問題） -->
        <div id="post-nav" class="mt-10"></div>

        <!-- 戻るボタン -->
        <div class="pt-4 border-t border-[#f0f9ff] text-center sm:text-left">
          <a
            href="./index.html"
            class="inline-flex items-center gap-2 text-xs font-bold text-[#0284c7] hover:text-[#0369a1] bg-[#e0f2fe] hover:bg-[#bae6fd] px-4 py-2.5 rounded-full transition-all duration-200"
          >
            ← 一覧にもどる
          </a>
        </div>
      </article>
    </main>

    <script type="module">
      import { parseMyText } from "./js/parser.js";

      const params = new URLSearchParams(window.location.search);
      const postId = params.get("id");

      if (!postId) {
        window.location.href = "./index.html";
      }

      // 画像HTML（index.htmlと同じ tape + polaroid 風デザイン）
      const createTapeImageHtml = (src, title) => {
        if (!src) return "";
        return `
          <div class="my-6 text-center">
            <div class="relative inline-block mx-auto">
              <div class="absolute -top-3 -left-3 w-16 h-6 bg-[#38bdf8]/70 rotate-[-15deg] rounded-sm z-10"></div>
              <div class="absolute -bottom-3 -right-3 w-16 h-6 bg-[#fb923c]/70 rotate-[-15deg] rounded-sm z-10"></div>

              <div class="bg-white p-1.5 border border-[#e2e8f0] rounded-sm shadow-[4px_4px_0px_#bae6fd]">
                 <img src="${src}" alt="${title}" class="max-h-[220px] w-auto object-contain" loading="lazy">
              </div>
            </div>
          </div>
        `;
      };

      const indexScript = document.createElement("script");
      indexScript.src = "./posts/index.js";

      indexScript.onload = async () => {
        const slugs = window.blogSlugs || [];
        const currentIndex = slugs.indexOf(postId);

        const script = document.createElement("script");
        script.src = `./posts/${postId}.js`;

        script.onload = async () => {
          const post = window.currentPost;
          if (!post) return;

          const formattedDate = post.date || postId.replace(/-/g, ".");

          document.title = `${post.title}`;
          document.getElementById("post-title").textContent = post.title;
          document.getElementById("post-date").textContent = formattedDate;

          let imageSrc = null;
          if (post.image) {
            imageSrc =
              post.image.startsWith("http") || post.image.startsWith("./")
                ? post.image
                : `./images/${post.image}`;
          }

          const bodyContainer = document.getElementById("post-body");
          if (post.problem) {
            let html = `<div class="bg-[#f0f9ff] p-5 rounded-2xl border border-[#bae6fd] mb-6">
                      <span class="text-xs font-bold text-[#0284c7] bg-white px-2 py-1 rounded-md mb-2 inline-block">問題</span>
                      <div>${parseMyText(post.problem)}</div>
                      ${createTapeImageHtml(imageSrc, post.title)}
                    </div>`;

            if (post.answer) {
              html += `<div class="bg-white p-5 rounded-2xl border border-[#e0f2fe] shadow-sm">
                     <span class="text-xs font-bold text-[#0369a1] bg-[#e0f2fe] px-2 py-1 rounded-md mb-2 inline-block">答え・解説</span>
                     <div>${parseMyText(post.answer)}</div>
                   </div>`;
            }
            bodyContainer.innerHTML = html;
          } else {
            let html = parseMyText(post.content);
            html += createTapeImageHtml(imageSrc, post.title);
            bodyContainer.innerHTML = html;
          }

          if (post.script) {
            const gameScript = document.createElement("script");
            gameScript.type = "module";
            gameScript.src = post.script;
            document.body.appendChild(gameScript);
          }

          // ナビゲーション処理
          const fetchPostTitle = (slug) => {
            return new Promise((resolve) => {
              const s = document.createElement("script");
              s.src = `./posts/${slug}.js`;
              s.onload = () => {
                const raw = window.currentPost || {};
                resolve({ slug, title: raw.title || "無題" });
              };
              document.head.appendChild(s);
            });
          };

          const prevSlug = currentIndex > 0 ? slugs[currentIndex - 1] : null;
          const nextSlug =
            currentIndex >= 0 && currentIndex < slugs.length - 1
              ? slugs[currentIndex + 1]
              : null;

          const [prevPost, nextPost] = await Promise.all([
            prevSlug ? fetchPostTitle(prevSlug) : Promise.resolve(null),
            nextSlug ? fetchPostTitle(nextSlug) : Promise.resolve(null),
          ]);

          const navContainer = document.getElementById("post-nav");
          if (navContainer) {
            let navHtml = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">`;
            if (prevPost) {
              navHtml += `
            <a href="./post.html?id=${prevPost.slug}" class="flex flex-col p-4 bg-[#f0f9ff] hover:bg-[#e0f2fe] border border-[#bae6fd] rounded-2xl transition-all duration-200 group">
              <span class="text-[11px] font-bold text-[#0284c7] mb-1">← 前の問題</span>
              <span class="text-sm font-bold text-[#334155] group-hover:text-[#0284c7] truncate">${prevPost.title}</span>
            </a>`;
            } else {
              navHtml += `<div></div>`;
            }

            if (nextPost) {
              navHtml += `
            <a href="./post.html?id=${nextPost.slug}" class="flex flex-col p-4 bg-[#f0f9ff] hover:bg-[#e0f2fe] border border-[#bae6fd] rounded-2xl transition-all duration-200 text-right group sm:col-start-2">
              <span class="text-[11px] font-bold text-[#0284c7] mb-1">次の問題 →</span>
              <span class="text-sm font-bold text-[#334155] group-hover:text-[#0284c7] truncate">${nextPost.title}</span>
            </a>`;
            }
            navHtml += `</div>`;
            navContainer.innerHTML = navHtml;
          }
        };

        document.head.appendChild(script);
      };

      document.head.appendChild(indexScript);
    </script>
  </body>
</html>
