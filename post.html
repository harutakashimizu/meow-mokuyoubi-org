<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              rounded: ["'M PLUS Rounded 1c'", "sans-serif"],
              pop: ["Fredoka", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="font-rounded text-[#334155] bg-[#f0f9ff] min-h-screen py-10 px-4 antialiased"
  >
    <main class="max-w-[680px] mx-auto">
      <article class="bg-white/90 backdrop-blur-sm border border-[#e0f2fe] rounded-3xl p-6 sm:p-10 shadow-sm">
        <p id="post-date" class="text-xs text-[#0284c7] font-semibold tracking-wider mb-2"></p>
        <h1
          id="post-title"
          class="text-2xl sm:text-3xl font-bold text-[#0f172a] mb-6"
        >
          loading...
        </h1>

        <div class="h-0.5 bg-[#f0f9ff] w-full mb-8 rounded-full"></div>

        <!-- 本文エリア -->
        <div
          id="post-body"
          class="text-[#475569] leading-relaxed space-y-4 text-sm sm:text-base"
        ></div>

        <!-- 戻るボタン -->
        <div class="mt-12 pt-6 border-t border-[#f0f9ff]">
          <a
            href="./index.html"
            class="inline-flex items-center gap-2 text-xs font-bold text-[#0284c7] hover:text-[#0369a1] bg-[#e0f2fe] hover:bg-[#bae6fd] px-4 py-2.5 rounded-full transition-all duration-200"
          >
            ← 一覧にもどる
          </a>
        </div>
      </article>
    </main>

    <script type="module">
      import { parseMyText } from "./js/parser.js";

      const params = new URLSearchParams(window.location.search);
      const postId = params.get("id");

      if (!postId) {
        window.location.href = "./index.html";
      }

      const script = document.createElement("script");
      script.src = `./posts/${postId}.js`;

      script.onload = () => {
        const post = window.currentPost;
        if (!post) return;

        const formattedDate = postId.replace(/-/g, ".");

        document.title = `${post.title}`;
        document.getElementById("post-title").textContent = post.title;
        document.getElementById("post-date").textContent = formattedDate;

        document.getElementById("post-body").innerHTML = parseMyText(
          post.content,
        );

        if (post.script) {
          const gameScript = document.createElement("script");
          gameScript.type = "module";
          gameScript.src = post.script;
          document.body.appendChild(gameScript);
        }
      };

      document.head.appendChild(script);
    </script>
  </body>
</html>
